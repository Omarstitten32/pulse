[workspace]
resolver = "2"
members = [
    "crates/pulse-cli",
    "crates/pulse-core",
    "crates/pulse-platform",
]

[workspace.package]
version      = "1.9.0"
edition      = "2021"
rust-version = "1.80"
license      = "MIT"
authors      = ["OMAR-DEV"]
description  = "Pulse - Deep system introspection for every platform"

[workspace.dependencies]
pulse-core     = { path = "crates/pulse-core" }
pulse-platform = { path = "crates/pulse-platform" }
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"

[profile.release]
opt-level       = "z"
lto             = "fat"
codegen-units   = 1
panic           = "abort"
strip           = true
incremental     = false
overflow-checks = true
debug           = false

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
